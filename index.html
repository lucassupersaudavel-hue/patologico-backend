<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATOLÓGICO - Assistente de Estudos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header Estilo App -->
    <header class="w-full bg-blue-600 text-white px-4 py-3 flex items-center justify-between shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <!-- Avatar do Pato -->
            <div class="w-10 h-10 rounded-full bg-white p-0.5 border-2 border-emerald-400 overflow-hidden shadow-sm flex items-center justify-center shrink-0">
                <span class="text-xl">🦆</span>
            </div>
            <div>
                <!-- Nome PATOLÓGICO (PATO em Azul, LÓGICO em Verde) -->
                <h1 class="font-extrabold text-xl leading-none tracking-wide">
                    <span class="text-sky-300">PATO</span><span class="text-emerald-300">LÓGICO</span>
                </h1>
                <div class="flex items-center gap-1.5 mt-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs text-blue-100 font-medium">Online • Seu parceiro nos estudos 🌿</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Banner Informativo -->
    <div class="max-w-3xl w-full mx-auto mt-4 px-4">
        <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3 flex items-center justify-between text-xs text-blue-900 shadow-sm">
            <span>✨ Pergunta sobre Biologia, Saúde e Patologia para aprender de forma simples!</span>
            <span class="text-base">🌱</span>
        </div>
    </div>

    <!-- Area do Chat -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
        
        <!-- Chat Box -->
        <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 pr-1 mb-4">
            <!-- Mensagem Inicial da IA -->
            <div class="flex gap-2.5 items-start">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold shrink-0 border border-emerald-400 shadow-sm">
                    🦆
                </div>
                <div class="bg-white text-slate-800 p-4 rounded-2xl rounded-tl-none max-w-[85%] text-sm leading-relaxed border border-slate-200 shadow-sm">
                    Olá! Eu sou o <strong class="text-sky-600">PATO</strong><strong class="text-emerald-600">LÓGICO</strong>! Como posso te ajudar nos seus estudos hoje? 📚🌿
                </div>
            </div>
        </div>

        <!-- Formulário de Envio -->
        <form id="chat-form" class="relative">
            <div class="bg-white rounded-full p-2 flex items-center gap-2 border border-slate-300 shadow-md focus-within:border-blue-500 transition-all">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Digite sua pergunta..." 
                    class="w-full bg-transparent px-4 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
                    autocomplete="off"
                />
                <button 
                    type="submit" 
                    class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-full transition-colors shrink-0 flex items-center justify-center shadow-md active:scale-95"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                    </svg>
                </button>
            </div>
        </form>

    </main>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-2.5 items-start ${role === 'user' ? 'justify-end' : ''}`;

            const isUser = role === 'user';
            
            msgDiv.innerHTML = `
                ${!isUser ? `
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold shrink-0 border border-emerald-400 shadow-sm">
                        🦆
                    </div>
                ` : ''}
                <div class="${isUser ? 'bg-emerald-100 text-emerald-950 border border-emerald-200 rounded-tr-none' : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none'} p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow-sm">
                    ${text}
                </div>
                ${isUser ? `
                    <div class="w-8 h-8 rounded-full bg-slate-700 text-white flex items-center justify-center text-xs font-bold shrink-0 shadow-sm">
                        👤
                    </div>
                ` : ''}
            `;

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'flex gap-2.5 items-start';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold shrink-0 border border-emerald-400 shadow-sm">
                    🦆
                </div>
                <div class="bg-white text-slate-500 border border-slate-200 p-4 rounded-2xl rounded-tl-none text-sm italic animate-pulse shadow-sm">
                    Pensando...
                </div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.reply) {
                    appendMessage('assistant', data.reply);
                } else {
                    appendMessage('assistant', 'Ops! Tive um problema ao responder.');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('assistant', 'Erro de conexão com o servidor.');
            }
        });
    </script>
</body>
</html>
